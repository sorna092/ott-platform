# VOD origin: serves transcoded movies from the Longhorn volume
server {
    listen 8080;
    server_name _;
    root /data/vod;

    location = /healthz { access_log off; return 200 "ok\n"; }

    location = /catalog.json {
        add_header Cache-Control "no-cache" always;
        add_header Access-Control-Allow-Origin "*" always;
    }
    location ~ \.m3u8$ {
        types { application/vnd.apple.mpegurl m3u8; }
        add_header Cache-Control "max-age=60" always;
        add_header Access-Control-Allow-Origin "*" always;
    }
    location ~ \.ts$ {
        types { video/mp2t ts; }
        add_header Cache-Control "max-age=86400" always;
        add_header Access-Control-Allow-Origin "*" always;
    }
    location ~ \.jpg$ {
        types { image/jpeg jpg; }
        add_header Cache-Control "max-age=3600" always;
    }
    location / { return 404; }
}
