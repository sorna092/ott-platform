# Web: serves the player page and the channel list
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz { access_log off; return 200 "ok\n"; }
    location = /channels.json { add_header Cache-Control "no-cache" always; }
    location / { add_header Cache-Control "no-cache" always; try_files $uri /index.html; }
}
