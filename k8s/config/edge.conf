# Edge cache: what viewers hit. Many viewers -> one request per file to the origin.
proxy_cache_path /cache levels=1:2 keys_zone=hls:50m max_size=2g inactive=2m use_temp_path=off;

# kube-dns ClusterIP (check: kubectl get svc -n kube-system kube-dns)
resolver 10.96.0.10 valid=10s ipv6=off;

server {
    listen 8080;
    server_name _;

    location = /healthz { access_log off; return 200 "ok\n"; }

    # Playlists change every few seconds: cache for 1s (micro-cache)
    location ~ ^/live/(?<ch>[a-z0-9-]+)/(?<file>[A-Za-z0-9_.-]+\.m3u8)$ {
        proxy_pass http://ch-$ch.ott.svc.cluster.local/$file;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_cache hls;
        proxy_cache_valid 200 1s;
        proxy_cache_lock on;
        proxy_cache_use_stale updating error timeout;
        add_header X-Cache-Status $upstream_cache_status always;
        add_header Cache-Control "max-age=1" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # Segments never change once written: cache for 60s
    location ~ ^/live/(?<ch>[a-z0-9-]+)/(?<file>[A-Za-z0-9_.-]+\.ts)$ {
        proxy_pass http://ch-$ch.ott.svc.cluster.local/$file;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_cache hls;
        proxy_cache_valid 200 60s;
        proxy_cache_lock on;
        add_header X-Cache-Status $upstream_cache_status always;
        add_header Cache-Control "max-age=60" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # ---------- VOD (uploaded movies) ----------
    # Movie list: short cache so new uploads appear within seconds
    location = /vod/catalog.json {
        set $vod_origin vod-store.ott.svc.cluster.local;   # variable = resolved per request
        proxy_pass http://$vod_origin/catalog.json;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_cache hls;
        proxy_cache_valid 200 5s;
        proxy_cache_lock on;
        add_header X-Cache-Status $upstream_cache_status always;
        add_header Cache-Control "no-cache" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # Movie playlists, segments and posters never change: cache for 10 minutes
    location ~ ^/vod/(?<vpath>[a-z0-9-]+/(?:v[0-9]+/)?[A-Za-z0-9_.-]+\.(?:m3u8|ts|jpg))$ {
        proxy_pass http://vod-store.ott.svc.cluster.local/$vpath;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_cache hls;
        proxy_cache_valid 200 10m;
        proxy_cache_lock on;
        add_header X-Cache-Status $upstream_cache_status always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    location / { return 404; }
}
